<div class="people-section">
  {% if include.title %}
  <h3 class="people-section__title">{{ include.title }}</h3>
  {% endif %}
  <div class="people-grid">
    {% for person in include.collection %}
    <article class="person-card" id="{{ person.id }}">
      <div class="person-card__photo">
        {% if person.photo %}
          <img src="{{ person.photo }}" alt="{{ person.name }}">
        {% else %}
          <div class="person-card__placeholder" aria-hidden="true"></div>
        {% endif %}
      </div>
      <div class="person-card__content">
        <h3 class="person-card__name">{{ person.name }}</h3>
        {% if person.role %}<p class="person-card__role">{{ person.role }}</p>{% endif %}
        {% if person.bio %}<p class="person-card__bio">{{ person.bio }}</p>{% endif %}
      </div>
    </article>
    {% endfor %}
  </div>
</div>
